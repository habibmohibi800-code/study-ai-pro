.link{color:var(--pr);font-size:14px;font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--bg2);overflow:hidden;margin-top:8px}

.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:14px;padding:8px 12px;font-size:13px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd);gap:10px}
select{font:inherit;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}
.empty .ic{margin:0 auto 12px;width:64px;height:64px;font-size:30px;border-radius:20px}
input.q{border:0;background:none;color:var(--tx);font:inherit;flex:1;min-width:0;outline-offset:6px}
</style>

// ---- PDF reading (pdf.js from cdnjs, loaded only when needed) ----
const PDFCDN="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const loadJS=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)});
async function pdfLib(){if(!window.pdfjsLib){await loadJS(PDFCDN+"pdf.min.js");for(let i=0;i<30&&!window.pdfjsLib;i++)await new Promise(r=>setTimeout(r,100))}
 if(!window.pdfjsLib)throw 0;
 if(!window.pdfjsWorker&&!window.__pw){window.__pw=1;try{await loadJS(PDFCDN+"pdf.worker.min.js")}catch(e){}}
 window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFCDN+"pdf.worker.min.js";return window.pdfjsLib}
async function pdfText(file,msg){const E=m=>Object.assign(new Error(m),{pdfMsg:m});
 if(file.size>10e6)throw E("That PDF is larger than 10 MB. Try a smaller file or paste the text.");
 msg("Loading PDF reader…");let lib;try{lib=await pdfLib()}catch(e){throw E("The PDF reader couldn't load. Check your internet connection and try again, or paste the text.")}
 let doc;try{doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}catch(e){throw E(e&&e.name==="PasswordException"?"This PDF is password-protected. Remove the password and try again.":"Couldn't open this PDF. It may be damaged.")}
 const n=Math.min(doc.numPages,60);let out="";
 for(let p=1;p<=n&&out.length<80000;p++){msg(`Reading page ${p} of ${n}…`);const tc=await(await doc.getPage(p)).getTextContent();out+=tc.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim()+"\n\n"}
 out=out.trim();if(out.length<20)throw E("No selectable text found. This looks like a scanned PDF. Use the Image & Text Reader with a photo or screenshot of each page.");
 return out.slice(0,80000)+(doc.numPages>n?`\n\n[Only the first ${n} of ${doc.numPages} pages were read.]`:"")}
